#
# Builds and tests the extension across DuckDB's full platform matrix.
#
# This exists because the extension had only ever been built two ways, both by hand: Linux/gcc on
# a pod and Windows/MSVC locally. The community-extensions repository builds it on macOS (amd64
# and arm64), musl and mingw as well, so without this the first build on those platforms is the
# one a maintainer sees rather than the one we see.
#
# wasm is NOT excluded, despite `description.yml` having excluded it since before this workflow
# existed. Nothing recorded a reason -- not the commit that introduced the exclusion, not any
# document -- and this extension is close to the ideal wasm candidate: pure C++11 arithmetic over
# doubles, zero dependencies by explicit design, no threads, no filesystem, no network. Those are
# the things extensions normally exclude wasm *for*. Building it here is how we find out whether
# the exclusion costs reach for no reason.
#
# `duckdb_version` and `ci_tools_version` are pinned to v1.5.5, matching the `duckdb` submodule
# exactly -- extension-ci-tools carries a branch per DuckDB release, and mixing them is how a
# green CI ends up proving something about a different DuckDB than the one that ships.
#
# Not enabled: the `_extension_code_quality.yml` job with `format;tidy`. There is no .clang-format
# in this repository, so it would fail on its first run for reasons unrelated to correctness.
# Worth adding after adopting DuckDB's format config, not before.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: rocket
