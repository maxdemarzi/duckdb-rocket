[tool.pytest.ini_options]
# The project is a uv application, not an installed distribution, so the repo root is not on
# sys.path for the test run. pytest only prepends the test files' own directory.
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "duckdb-rocket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aeon>=1.5.0",
    "duckdb>=1.5.5",
    "numpy>=2.3.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.8.0",
    "tabpfn>=8.2.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
